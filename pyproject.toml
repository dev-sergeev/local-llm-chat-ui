[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-chat-ui"
version = "0.1.0"
description = "Localhost chat UI for GigaChat and OpenAI-compatible LLM endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-gigachat",
  "langchain-openai",
]

[project.optional-dependencies]
test = [
  "pip",
  "pytest",
  "setuptools",
  "tomli; python_version < '3.11'",
  "wheel",
]

[project.scripts]
local-llm-chat = "datalab_chat.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalab_chat = ["static/*.html", "static/assets/*.css", "static/assets/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
